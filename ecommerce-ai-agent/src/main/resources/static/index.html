<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce AI Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 160px); }
        .message-user { background-color: #3b82f6; color: white; align-self: flex-end; }
        .message-bot { background-color: #f3f4f6; color: #1f2937; align-self: flex-start; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-4xl mx-auto p-4">
        <header class="flex items-center justify-between mb-6 bg-white p-4 rounded-lg shadow-sm">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <span>🤖</span> Ecommerce AI Agent
            </h1>
            <div class="text-sm text-gray-500">Online | Powered by Ollama</div>
        </header>

        <div class="bg-white rounded-lg shadow-lg overflow-hidden flex flex-col">
            <div id="chatWindow" class="chat-container overflow-y-auto p-4 flex flex-col gap-4">
                <!-- Initial Bot Message -->
                <div class="message-bot p-3 rounded-lg max-w-[80%] shadow-sm">
                    Hello! I'm your Ecommerce AI Assistant. How can I help you today with orders, products, or payments?
                </div>
            </div>

            <div class="p-4 border-t bg-gray-50">
                <form id="chatForm" class="flex gap-2">
                    <input type="text" id="userInput" 
                        class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                        placeholder="Ask me about your orders or products..." required>
                    <button type="submit" 
                        class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                        Send
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chatWindow');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-3 rounded-lg max-w-[80%] shadow-sm ${isUser ? 'message-user' : 'message-bot'}`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = '';

            // Show loading state
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message-bot p-3 rounded-lg max-w-[80%] shadow-sm italic text-gray-500';
            loadingDiv.textContent = 'Thinking...';
            chatWindow.appendChild(loadingDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: text
                });

                if (!response.ok) throw new Error('Server error');
                
                const data = await response.text();
                chatWindow.removeChild(loadingDiv);
                appendMessage(data, false);
            } catch (error) {
                chatWindow.removeChild(loadingDiv);
                appendMessage('Sorry, I encountered an error. Please try again.', false);
                console.error(error);
            }
        });
    </script>
</body>
</html>
