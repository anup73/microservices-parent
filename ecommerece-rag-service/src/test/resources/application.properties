app.sqlite-vec.enabled=false

# Bean construction only needs a syntactically valid JDBC URL/driver; the pool connects lazily
# on first use, so no real MySQL instance is required just to load the application context.
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce_db
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

