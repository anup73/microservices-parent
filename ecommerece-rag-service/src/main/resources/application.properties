spring.application.name=ecommerece-rag-service
server.port=8081

logging.file.name=logs/ecommerce-rag.log

app.sqlite-vec.database-url=jdbc:sqlite:./data/ecommerce-rag.db
app.sqlite-vec.enabled=true
# Must match the Ollama embedding model's length (nomic-embed-text = 768).
app.sqlite-vec.dimensions=768
# Set to the extracted vec0 native library for the deployment platform, for example:
app.sqlite-vec.extension-path=C:/tools/sqlite-vec/vec0.dll

app.rag.ollama.base-url=http://localhost:11434
# Use a local embedding model. Cloud chat models (e.g. gemma4:31b-cloud) do not support /api/embed.
app.rag.ollama.model=nomic-embed-text
# Optional for cloud chat models only: APP_RAG_OLLAMA_API_KEY / OLLAMA_API_KEY or app.rag.ollama.api-key
app.rag.ollama.batch-size=32
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
