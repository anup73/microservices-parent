spring.application.name=agent
spring.profiles.active=ecommerce

# --- OAuth2 Resource Server ---
# This app now only accepts requests carrying a valid JWT access token issued by an
# external OAuth2/OIDC authorization server. Once that server exists, set ONE of:
#   1) issuer-uri  (preferred - enables OIDC discovery of the JWK set automatically)
#      spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-auth-server.example.com
#   2) jwk-set-uri (if the auth server has no discovery endpoint)
#      spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://your-auth-server.example.com/.well-known/jwks.json
# Values are read from environment variables so the app can start without a hardcoded URL.
# Defaults point at the local ecommerce-auth-server (client_credentials-only, port 9000).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI:}
